# Builds an installable debug APK on every push and makes it downloadable from the
# run's "Artifacts" section. No signing keystore/secrets required: debug builds are
# auto-signed by the Android Gradle Plugin with a throwaway debug key, which is fine
# for sideloading onto your own device but should not be treated as a public release.
#
# To run manually without pushing: go to the Actions tab -> "Build Debug APK" -> "Run workflow".
name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperize-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
